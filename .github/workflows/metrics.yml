name: Calendario 3D y hábitos

on:
  schedule:
    - cron: "30 6 * * *"   # diario, 2:30 a. m. de Santo Domingo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - name: Aviso si falta el token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Falta el secret METRICS_TOKEN; no se generan las métricas."

      - name: Calendario isométrico 3D
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: America/Santo_Domingo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Hábitos de código
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/habits.svg
          base: ""
          config_timezone: America/Santo_Domingo
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_habits_languages_limit: 6
          plugin_habits_trim: yes
