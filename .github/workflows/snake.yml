name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días a las 2:00 a. m. de Santo Domingo
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar la serpiente con los colores RST
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#C8102E&color_dots=#161b22,#4a0c14,#7a0f1d,#a8122a,#e0182f
            dist/snake-light.svg?color_snake=#C8102E&color_dots=#ebedf0,#f6c3c9,#ea8593,#d6475a,#c8102e

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
